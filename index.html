<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sala de Jogos</title>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f14;--ink:#f3efe6;--mut:#9a98a3;--line:#262833}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% -10%,#1e2233,var(--bg) 60%);color:var(--ink);font-family:Inter,sans-serif}
header{max-width:1000px;margin:0 auto;padding:48px 20px 20px}
h1{font-family:'Alfa Slab One',serif;font-weight:400;font-size:clamp(38px,8vw,72px);line-height:1;margin:0;letter-spacing:.01em}
header p{color:var(--mut);margin:12px 0 0;max-width:46ch;line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
a.g{display:block;color:inherit;text-decoration:none;border-radius:14px;overflow:hidden;background:#15161d;border:1px solid var(--line);transition:transform .25s,box-shadow .25s}
a.g:hover,a.g:focus-visible{transform:translateY(-8px) rotate(-1deg);box-shadow:0 18px 40px #000a;outline:none}
.cv{display:block;width:100%;aspect-ratio:3/4}
.in{padding:14px 16px 16px}
.in h2{margin:0;font-size:19px;font-family:'Alfa Slab One',serif;font-weight:400}
.in p{margin:6px 0 10px;color:var(--mut);font-size:13.5px;line-height:1.45}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.tg span{font-size:11.5px;padding:3px 9px;border-radius:99px;background:#232634;color:#cfcddb}
footer{max-width:1000px;margin:0 auto;padding:30px 20px 50px;color:var(--mut);font-size:13px}
@media(prefers-reduced-motion:reduce){a.g{transition:none}a.g:hover{transform:none}}
</style>
</head>
<body>
<header>
 <h1>Sala de Jogos</h1>
 <p>Jogos para jogar com a galera, direto no navegador. Escolha um, crie a sala e mande o link.</p>
</header>
<main id="m"></main>
<footer>Dica: libere o microfone ao entrar numa sala para conversar por voz durante a partida.</footer>
