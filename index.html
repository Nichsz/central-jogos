<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c10;--ink:#f5f2eb;--mut:#9ca3af;--line:#262936;--gold:#fde68a}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#1f2437,var(--bg) 65%) fixed;color:var(--ink);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
header{max-width:1040px;margin:0 auto;padding:44px 20px 10px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px}
h1{font-family:'Alfa Slab One',serif;font-weight:400;font-size:clamp(34px,6.5vw,60px);line-height:1.05;margin:0;letter-spacing:.02em;color:#fef3c7;text-shadow:0 4px 20px #000a}
.sb{position:relative;flex:0 1 260px;min-width:180px}
.sb input{width:100%;font:inherit;font-size:14px;color:var(--ink);background:#14161fcc;border:1px solid var(--line);border-radius:99px;padding:11px 16px 11px 40px;outline:none;transition:border-color .2s,box-shadow .2s}
.sb input::placeholder{color:var(--mut)}
.sb input:focus{border-color:#d4af3788;box-shadow:0 0 0 3px #d4af3722}
.sb svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
main{max-width:1040px;margin:0 auto;padding:22px 20px 56px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:22px}
a.g{position:relative;display:block;color:inherit;text-decoration:none;border-radius:18px;overflow:hidden;background:#14161f;border:1px solid var(--line);box-shadow:0 10px 25px #0008;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;backface-visibility:hidden;animation:in .45s ease both;animation-delay:calc(var(--i)*60ms)}
a.g:hover,a.g:focus-visible{transform:translateY(-6px);box-shadow:0 20px 40px #000c,0 0 0 1px #d4af3755;border-color:#d4af37aa;outline:none}
a.g::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff26 50%,transparent 65%);transform:translateX(-120%);transition:transform .7s ease;pointer-events:none}
a.g:hover::after{transform:translateX(120%)}
a.g:active{transform:translateY(-2px) scale(.985)}
.cv{display:block;width:100%;aspect-ratio:3/4;background:#0f1117}
.cv text{font-family:'Alfa Slab One',serif;font-weight:400;text-rendering:geometricPrecision}
.nm{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 13px;text-align:center;font-family:'Alfa Slab One',serif;font-size:clamp(17px,2.2vw,21px);line-height:1.15;letter-spacing:.02em;color:var(--gold);text-shadow:0 2px 10px #000;background:linear-gradient(to top,#05060aee 0%,#05060ab0 50%,#05060a00 100%);transition:color .2s}
a.g:hover .nm,a.g:focus-visible .nm{color:#fff7d1}
.nada{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0;font-size:15px}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(max-width:520px){main{grid-template-columns:repeat(2,1fr);gap:14px;padding:16px 14px 40px}header{padding:30px 14px 4px}.nm{font-size:15px;padding:34px 8px 12px}}
@media(prefers-reduced-motion:reduce){a.g{transition:none;animation:none}a.g:hover{transform:none}}
</style>
</head>

const games=[
{t:'Intrigas da Corte',href:'games/intrigas-da-corte/',c:covers.coup},
{t:'Boteco do Truco',href:'games/truco/',c:covers.truco},
{t:'Jogo da Vida BR',href:'games/jogo-da-vida-br/',c:covers.vida},
{t:'Fechou a Conta',href:'games/fechou-a-conta/',c:covers.conta},
{t:'Aventura no ABC',href:'games/aventura-abc/',c:covers.aventura}];

const m=document.getElementById('m'),q=document.getElementById('q');
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function render(){
 const f=norm(q.value.trim());
 const list=games.filter(g=>norm(g.t).includes(f));
 m.innerHTML=list.length
  ? list.map((g,i)=>`<a class="g" style="--i:${i}" href="${g.href}" aria-label="${g.t}">${g.c}<span class="nm">${g.t}</span></a>`).join('')
  : '<div class="nada">Nenhum jogo encontrado.</div>';
}
q.addEventListener('input',render);
addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}});
render();
</script>
