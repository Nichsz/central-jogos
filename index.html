<meta charset="UTF-8">

<title>Sala de Jogos</title>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c10;--ink:#f5f2eb;--mut:#9ca3af;--line:#262936}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#1f2437,var(--bg) 65%);color:var(--ink);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
header{max-width:1040px;margin:0 auto;padding:44px 20px 18px}
h1{font-family:'Alfa Slab One',serif;font-weight:400;font-size:clamp(36px,7vw,64px);line-height:1.05;margin:0;letter-spacing:.02em;color:#fef3c7;text-shadow:0 4px 20px #000a}
header p{color:var(--mut);margin:10px 0 0;max-width:52ch;line-height:1.5;font-size:15px}
main{max-width:1040px;margin:0 auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
a.g{display:flex;flex-direction:column;color:inherit;text-decoration:none;border-radius:16px;overflow:hidden;background:#14161f;border:1px solid var(--line);box-shadow:0 10px 25px #0008;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;backface-visibility:hidden}
a.g:hover,a.g:focus-visible{transform:translateY(-6px);box-shadow:0 20px 40px #000c;border-color:#d4af3788;outline:none}
.cv{display:block;width:100%;aspect-ratio:3/4;background:#0f1117}
.cv text{font-family:'Alfa Slab One',serif;font-weight:400;text-rendering:geometricPrecision}
.in{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1;justify-content:space-between}
.in h2{margin:0;font-size:19px;font-family:'Alfa Slab One',serif;font-weight:400;color:#fde68a;letter-spacing:.02em}
.in p{margin:6px 0 12px;color:var(--mut);font-size:13.5px;line-height:1.45}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.tg span{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:#212432;color:#d1d5db;border:1px solid #ffffff12}
footer{max-width:1040px;margin:0 auto;padding:28px 20px 48px;color:var(--mut);font-size:13px}
@media(prefers-reduced-motion:reduce){a.g{transition:none}a.g:hover{transform:none}}
</style>
</head>

</header>
