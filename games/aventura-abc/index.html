<style>

.pill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 9px 2px 2px;display:flex;align-items:center;font-size:12px;animation:pop .35s}

#ban.on{animation:ban 2.8s ease}

.dp{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:3px;opacity:.8}.dp button{font-size:22px;border-radius:18px}
#bA{width:88px;height:88px;border-radius:50%;background:var(--gold);color:#241a05;font-weight:800;font-size:30px;border:0;opacity:.9;box-shadow:0 5px 0 #a47a1f}
@media(hover:hover) and (pointer:fine){#pad{display:none}}

.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}.rg>div{background:#0a1216aa;border:1px solid var(--line);border-radius:12px;padding:6px 2px;text-align:center;font-size:11px}.rg canvas{width:56px;height:56px}

.mv{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mv{grid-template-columns:repeat(4,1fr)}@media(max-width:620px){.mv{grid-template-columns:1fr 1fr}}.mv button{padding:9px 4px;font-size:14px;font-weight:700}
@keyframes pop{from{transform:scale(.6);opacity:0}}@keyframes fi{from{opacity:0}}@keyframes up{from{transform:translate(-50%,20px);opacity:0}}

@keyframes ko{to{transform:translateY(50px);opacity:0}}@keyframes glow{0%,100%{filter:none}50%{filter:brightness(5) saturate(0)}}

<script>
const $=i=>document.getElementById(i),sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=n=>Math.floor(Math.random()*n);

/* ===== Áudio (tudo sintetizado) ===== */
let AC=null;
const ac=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume();return AC};
function tone(f,d,ty,v,t0,sl){const a=AC;if(!a||!S||!S.vol)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(t0||0);o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t+d);g.gain.setValueAtTime((v||.05)*.6,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
const seq=(fs,d,ty,v,gap)=>fs.forEach((f,i)=>tone(f,d,ty,v,i*gap));

 {r:62,ms:125,w:'sawtooth',p:[0,3,0,3,7,3,0,3,5,8,5,8,12,8,5,8],b:[0,0,0,0,3,3,5,5]},{r:60,ms:300,p:[0,4,7,null,12,7,4,null,5,9,12,null,9,7,4,2],b:[0,0,5,5,0,0,7,7]}];

function music(i){if(i===th)return;th=i;clearInterval(mt);mi=0;if(i<0)return;const q=TH[i];mt=setInterval(()=>{if(!AC||S.vol<2)return;const n=q.p[mi%16];if(n!=null)tone(midi(q.r+n),q.ms/500,'triangle',.012);if(mi%2==0)tone(midi(q.r-12+q.b[(mi>>1)%8]),q.ms/450,'sine',.03);mi++},q.ms)}

 caramelo:{n:'Caramelo',t:'brasa',k:'dog',c:['#d9a066','#f3dcb8','#a8703c'],hp:28,at:7,sp:'Latido Épico',ev:[14,'vira']},

const mk=(s,lv)=>{const c={s,lv,xp:0};c.mx=mxOf(c);c.hp=c.mx;return c};
/* Desenha a criatura (de frente) num canvas novo */
function critBase(s,sz){
 const cv=document.createElement('canvas');cv.width=cv.height=sz;

async function evo(a){const P=SP[a.s];if(!P.ev||a.lv<P.ev[0])return;const el=$('me');bsay('Hã? '+P.n+' está brilhando!');SF.evo();await an(el,'glow',1500);const r=a.hp/a.mx;a.s=P.ev[1];S.dex[a.s]=2;a.mx=mxOf(a);a.hp=Math.min(a.mx,Math.round(a.mx*r+a.mx*.25));el._c=null;bui();bsay(P.n+' evoluiu para '+SP[a.s].n+'! ✨');SF.win();await sleep(1700)}
async function foeDown(){
 const d=F();bsay(SP[d.s].n+' foi derrotado!');an($('foe'),'ko',800);await sleep(950);
 bat.prize+=d.lv*(bat.trainer?12:4);
 const a=Me();a.xp+=d.lv*9;let up=0;
 while(a.xp>=a.lv*10){a.xp-=a.lv*10;a.lv++;const o=a.mx;a.mx=mxOf(a);a.hp=Math.min(a.mx,a.hp+(a.mx-o)+3);up=1}
 if(up){bsay(SP[a.s].n+' subiu para o nível '+a.lv+'! 🎉');SF.lvl();bui();await sleep(1200);await evo(a)}
 if(bat.fi+1<bat.foes.length){bat.fi++;bsay(bat.trainer+' enviou '+SP[F().s].n+'!');bat.lock=false;bui();return}
 S.money+=bat.prize;bsay('Você ganhou R$ '+bat.prize+'!');SF.win();await sleep(1100);endBat(true)}
async function meDown(){
 bsay(SP[Me().s].n+' desmaiou!');an($('me'),'ko',800);await sleep(1000);
 const n=S.team.findIndex(c=>c.hp>0);
 if(n<0){bsay('Todos os parceiros desmaiaram… Você foi levado ao Posto de Saúde.');SF.lose();await sleep(1800);healAll();const r=reg(S.x,S.y);S.x=(r&1)*ZW+4;S.y=(r>>1)*ZH+7;pl.x=S.x*T;pl.y=S.y*T;cam.i=1;endBat(false);return}
 bat.mi=n;bat.lock=false;bui();bsay(SP[Me().s].n+' entrou na luta!')}
function swap(){if(bat.lock)return;const o=S.team.map((c,i)=>i).filter(i=>i!=bat.mi&&S.team[i].hp>0);if(!o.length)return;bat.mi=o[0];bat.lock=true;SF.ui();bsay('Você trocou para '+SP[Me().s].n+'!');bui();sleep(900).then(foeTurn)}
async function cafe(k,v){if(bat.lock||!S.bag[k])return;bat.lock=true;S.bag[k]--;const a=Me();a.hp=Math.min(a.mx,a.hp+v);SF.heal();fnum($('me'),'+'+v,'#7dff9a');bsay('Você deu um café para '+SP[a.s].n+'! (+'+v+' PS)');bui();await sleep(1000);await foeTurn()}
async function net(s){
 if(bat.lock)return;const k=s?'gnet':'net';if(!S.bag[k])return;bat.lock=true;S.bag[k]--;bui();const d=F();bsay('Você lançou '+(s?'a Rede Forte':'uma rede')+'! 🕸️');SF.net();fnum($('foe'),'🕸️');await sleep(1100);
 const p=Math.min(.95,(.25+(1-d.hp/d.mx)*.65)*(s?1.45:1));
 if(Math.random()<p){an($('foe'),'glow',900);bsay('Capturou '+SP[d.s].n+'! 🎉');SF.cap();await sleep(1300);S.dex[d.s]=2;if(S.team.length<6)S.team.push(d);else bsay('Time cheio: '+SP[d.s].n+' foi solto de volta.');await sleep(600);endBat(true,1)}
 else{bsay(SP[d.s].n+' escapou da rede!');SF.bump();await sleep(800);await foeTurn()}}
async function flee(){if(bat.lock)return;bat.lock=true;bui();if(Math.random()<.6){bsay('Você fugiu!');await sleep(800);endBat(true,1)}else{bsay('Não conseguiu fugir!');SF.bump();await sleep(800);await foeTurn()}}
function endBat(win,quiet){const cb=bat.done;bat=null;busy=false;$('bt').style.display='none';music(cur);save();hud();if(win&&cb&&!quiet)cb()}

/* ===== Entrada e telas ===== */
document.querySelectorAll('[data-d]').forEach(b=>{
 const d=b.dataset.d.split(',').map(Number);
 b.addEventListener('pointerdown',e=>{e.preventDefault();ac();press(d)});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{if(dir===d)dir=null}))});
$('bA').addEventListener('pointerdown',e=>{e.preventDefault();ac();act()});
$('box').addEventListener('pointerdown',e=>{e.preventDefault();act()});
const KM={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;const k=KM[e.key];if(k){e.preventDefault();if(!e.repeat)press(k)}else if(e.key=='b'||e.key=='i'){if(!bat&&!busy&&!dlg)bag('t')}else if(e.key==' '||e.key=='Enter'||e.key=='e'){e.preventDefault();act()}});
addEventListener('keyup',e=>{if(KM[e.key]&&dir===KM[e.key])dir=null});
function press(d){dir=d;dirT=performance.now();if(dlg||busy||bat)return;if(face[0]!=d[0]||face[1]!=d[1]){if(!moving())face=d.slice()}else qd=d}
function fs(){const d=document,e=d.documentElement;try{if(!(d.fullscreenElement||d.webkitFullscreenElement)){(e.requestFullscreen||e.webkitRequestFullscreen).call(e);try{screen.orientation.lock('landscape').catch(()=>{})}catch(x){}}else(d.exitFullscreen||d.webkitExitFullscreen).call(d)}catch(x){}}
$('bf').onclick=fs;
$('bs').onclick=()=>{S.vol=(S.vol+2)%3;save();hud();if(S.vol){ac();SF.ui()}};
$('br').onclick=()=>{if(confirm('Apagar o progresso e recomeçar?')){try{localStorage.removeItem('abc_adv')}catch(e){}location.reload()}};
function enter(){ac();fs();$('ti').style.display='none';music(cur<0?0:cur)}
$('bc').onclick=()=>{enter();hud()};
$('bn').onclick=()=>{if(S.f.starter&&!confirm('Começar um novo jogo apaga o progresso atual. Continuar?'))return;try{localStorage.removeItem('abc_adv')}catch(e){}S=fresh();ac();fs();$('ti').style.display='none';$('in1').value='';$('in2').value='';$('nm').style.display='flex';music(5)};
$('go').onclick=()=>{S.name=$('in1').value.trim()||'Você';S.rv=$('in2').value.trim()||'Caio';S.x=4;S.y=7;pl.x=4*T;pl.y=7*T;cam.i=1;$('nm').style.display='none';save();SF.cap();music(0);hud();ban(ZN[0],ZS[0]);
 say(['Bem-vindo a Santo André, no ABC paulista! 🌆',S.name+', sua mãe disse que o Prof. '+PROF+' quer falar com você no laboratório.','Use as setas para andar e A para conversar. Fale com sua mãe e depois com o professor.'])};

load();pl.x=S.x*T;pl.y=S.y*T;
if(S.f.starter||S.name){$('bc').style.display='block';$('bc').textContent='▶ Continuar · '+S.name}
['caramelo','capi','sagui','onca','vira'].forEach(s=>$('cr').appendChild(crit(s,120)));
$('ti').style.display='flex';hud();requestAnimationFrame(frame);
document.addEventListener('pointerdown',()=>{if(AC||$('ti').style.display=='none')ac()},{once:true});
