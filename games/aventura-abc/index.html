let AC=null;

function tone(f,d,ty,v,t0,sl){const a=AC;if(!a||!S||!S.vol)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(t0||0);o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t+d);g.gain.setValueAtTime((v||.05)*.6,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}

function burst(x,y,em,n,r){for(let i=0;i<n;i++){const s=emo(em,20),a=i/n*6.28,d=(r||70)*(.6+Math.random()*.6);s.animate([{transform:`translate(${x}px,${y}px) scale(.5)`,opacity:1},{transform:`translate(${x+Math.cos(a)*d}px,${y+Math.sin(a)*d}px) scale(1.3)`,opacity:0}],{duration:700,easing:'ease-out'}).onfinish=()=>s.remove()}}
async function proj(a,b,em,n){const[ax,ay]=ctr(a),[bx,by]=ctr(b);for(let i=0;i<n;i++){const s=emo(em);s.animate([{transform:`translate(${ax}px,${ay}px) scale(.6)`,opacity:0},{opacity:1,offset:.15},{transform:`translate(${bx+rnd(50)-25}px,${by+rnd(50)-25}px) scale(1.3) rotate(${rnd(360)}deg)`,opacity:1}],{duration:380,delay:i*70,easing:'ease-in',fill:'both'}).onfinish=()=>s.remove()}await sleep(380+n*70);burst(bx,by,em,8,60)}
function slash(el){const[x,y]=ctr(el);for(const r of[0,90]){const d=document.createElement('div');d.className='slash';d.style.cssText='left:'+(x-50)+'px;top:'+(y-50)+'px;transform:rotate('+r+'deg)';document.body.appendChild(d);setTimeout(()=>d.remove(),420)}}
function shake(){const e=$('bt').firstElementChild;e.classList.remove('shk');void e.offsetWidth;e.classList.add('shk')}
const canEvo=c=>SP[c.s].ev&&c.lv>=SP[c.s].ev[0];
function evoNow(c){const n=SP[c.s].ev[1];c.s=n;S.dex[n]=2;c.mx=mxOf(c);c.hp=Math.min(c.mx,c.hp+Math.round(c.mx*.25))}
function un(k){return new Promise(r=>{const o=$('un'),cc=crit(k,170);cc.className='unc';$('unc').innerHTML='';$('unc').appendChild(cc);$('unn').textContent=SP[k].n;$('unt').innerHTML='<span class="chip" style="background:'+TY[SP[k].t][1]+'">'+TY[SP[k].t][0]+'</span>';o.style.display='flex';SF.win();burst(innerWidth/2,innerHeight/2.4,'✨',18,150);$('unb').onclick=()=>{o.style.display='none';SF.ui();r()}})}
async function atk(isMe,m){
 const a=isMe?Me():F(),d=isMe?F():Me(),ae=$(isMe?'me':'foe'),de=$(isMe?'foe':'me'),nm=(isMe||bat.trainer?'':'Selvagem ')+SP[a.s].n;
 if(m&&Math.random()<.2){bsay(nm+' errou '+SP[a.s].sp+'!');SF.bump();await sleep(900);return}
 const r=dmg(a,d,m);bsay(nm+' usou '+(m?SP[a.s].sp:'Ataque')+'!'+eff(r.m));
 an(ae,isMe?'lungeM':'lungeF',420);
 if(m){await sleep(150);await proj(ae,de,TYE[SP[a.s].t],6)}else{await sleep(230);slash(de);await sleep(130)}
 d.hp-=r.x;(r.m>1?SF.crit:SF.hit)();if(r.m>1)shake();fnum(de,'-'+r.x,r.m>1?'#ffd34a':r.m<1?'#9ab':'#fff');an(de,'hit',450);bui();await sleep(600)}
async function mv(m){if(bat.lock)return;bat.lock=true;bui();await atk(1,m);if(F().hp<=0){await foeDown();return}await foeTurn()}
async function foeTurn(){await atk(0,Math.random()<.3);if(Me().hp<=0){await meDown();return}bat.lock=false;bui();bsay('O que fazer?')}
async function evo(a){const P=SP[a.s];if(!canEvo(a))return;const el=$('me'),nk=P.ev[1],nw=S.dex[nk]!=2;bsay('Hã? '+P.n+' está brilhando!');SF.evo();const[x,y]=ctr(el);burst(x,y,'✨',14,100);await an(el,'glow',1500);const r=a.hp/a.mx;a.s=nk;S.dex[nk]=2;a.mx=mxOf(a);a.hp=Math.min(a.mx,Math.round(a.mx*r+a.mx*.25));el._c=null;if(bat.g[bat.mi])bat.g[bat.mi].evo=1;bui();bsay(P.n+' evoluiu para '+SP[nk].n+'! ✨');SF.win();await sleep(1700);if(nw)await un(nk)}
async function foeDown(){
 const d=F(),tot=Math.round(d.lv*11*(bat.trainer?1.5:1));
 bsay(SP[d.s].n+' foi derrotado!');an($('foe'),'ko',800);await sleep(950);
 bat.prize+=d.lv*(bat.trainer?12:4);
 const ids=[...bat.part].filter(i=>S.team[i]&&S.team[i].hp>0),sh=Math.max(1,Math.round(tot/Math.max(1,ids.length)));
 for(const i of ids){const c=S.team[i],G=bat.g[i]||(bat.g[i]={c,lv:c.lv,xp:c.xp,got:0,evo:0});G.got+=sh;c.xp+=sh;let up=0;
  while(c.xp>=c.lv*10){c.xp-=c.lv*10;c.lv++;const o=c.mx;c.mx=mxOf(c);c.hp=Math.min(c.mx,c.hp+(c.mx-o)+3);up=1}
  if(i==bat.mi){fnum($('me'),'+'+sh+' XP','#ffd34a');bsay(SP[c.s].n+' ganhou '+sh+' XP!'+(ids.length>1?' (dividido com quem lutou)':''));await sleep(1000);bui();
   if(up){bsay(SP[c.s].n+' subiu para o nível '+c.lv+'! 🎉');SF.lvl();bui();await sleep(1200);await evo(c)}}
  else if(up&&canEvo(c)){evoNow(c);G.evo=1}}
 if(bat.fi+1<bat.foes.length){bat.fi++;bat.part=new Set([bat.mi]);bsay(bat.trainer+' enviou '+SP[F().s].n+'!');bat.lock=false;bui();return}
 S.money+=bat.prize;await result();endBat(true)}
function result(){return new Promise(res=>{
 const m=$('mv'),gs=Object.values(bat.g);m.style.gridTemplateColumns='1fr';SF.win();bsay('🏆 Vitória! Você ganhou R$ '+bat.prize+'.');
 m.innerHTML=gs.map((G,i)=>{const c=G.c,up=c.lv>G.lv;return`<div class="mc" style="margin:0"><div style="flex:none" id="rc${i}"></div><div><b>${SP[c.s].n}</b> Nv${G.lv}${up?' → <b style="color:#ffd34a">Nv'+c.lv+'</b> 🎉':''}${G.evo?' · ✨ Evoluiu!':''}<div class="bar"><i id="rb${i}" style="width:${up?0:G.xp/(G.lv*10)*100}%;background:#58b0ee"></i></div><small>+${G.got} XP · ${c.xp}/${c.lv*10} para o próximo nível</small></div></div>`}).join('')+'<button class="big" id="rok" style="padding:10px;font-size:17px">Continuar</button>';
 gs.forEach((G,i)=>{$('rc'+i).appendChild(crit(G.c.s,48));setTimeout(()=>{$('rb'+i).style.width=(G.c.xp/(G.c.lv*10)*100)+'%'},200)});
 $('rok').onclick=()=>{m.style.gridTemplateColumns='';SF.ui();res()}})}
async function meDown(){
 bsay(SP[Me().s].n+' desmaiou!');an($('me'),'ko',800);await sleep(1000);
 const n=S.team.findIndex(c=>c.hp>0);
 if(n<0){bsay('Todos os parceiros desmaiaram… Você foi levado ao Posto de Saúde.');SF.lose();await sleep(1800);healAll();const r=reg(S.x,S.y);S.x=(r&1)*ZW+4;S.y=(r>>1)*ZH+7;pl.x=S.x*T;pl.y=S.y*T;cam.i=1;endBat(false);return}
 bat.mi=n;bat.part.add(n);bat.lock=false;bui();bsay(SP[Me().s].n+' entrou na luta!')}
function swap(){if(bat.lock)return;const o=S.team.map((c,i)=>i).filter(i=>i!=bat.mi&&S.team[i].hp>0);if(!o.length)return;bat.mi=o[0];bat.part.add(bat.mi);bat.lock=true;SF.ui();bsay('Você trocou para '+SP[Me().s].n+'!');bui();sleep(900).then(foeTurn)}
async function cafe(k,v){if(bat.lock||!S.bag[k])return;bat.lock=true;S.bag[k]--;const a=Me();a.hp=Math.min(a.mx,a.hp+v);SF.heal();fnum($('me'),'+'+v,'#7dff9a');bsay('Você deu um café para '+SP[a.s].n+'! (+'+v+' PS)');bui();await sleep(1000);await foeTurn()}
async function net(s){
 if(bat.lock)return;const k=s?'gnet':'net';if(!S.bag[k])return;bat.lock=true;S.bag[k]--;bui();const d=F();bsay('Você lançou '+(s?'a Rede Forte':'uma rede')+'!');SF.net();
 const ball=document.createElement('div');ball.className='ball'+(s?' g':'');document.body.appendChild(ball);
 const[ax,ay]=ctr($('me')),[bx0,by0,bb]=ctr($('foe')),bx=bx0-22,by=by0-22,P=(x,y,r)=>`translate(${x}px,${y}px) rotate(${r||0}deg)`;
 await ball.animate([{transform:P(ax,ay)+' scale(.6)'},{transform:P((ax+bx)/2,Math.min(ay,by)-110,360)+' scale(1)',offset:.5},{transform:P(bx,by,720)+' scale(1)'}],{duration:700,easing:'ease-in',fill:'forwards'}).finished;
 const sp=$('foe').querySelector('.sp');sp.animate([{transform:'scale(1)',filter:'none',opacity:1},{transform:'scale(.15)',filter:'brightness(5)',opacity:0}],{duration:380,fill:'forwards'});SF.net();await sleep(380);
 const gy=by+bb.height*.3;await ball.animate([{transform:P(bx,by,720)},{transform:P(bx,gy,720)}],{duration:260,easing:'ease-in',fill:'forwards'}).finished;
 const ok=Math.random()<Math.min(.95,(.25+(1-d.hp/d.mx)*.65)*(s?1.45:1)),n=ok?3:rnd(3);
 for(let i=0;i<n;i++){await sleep(300);SF.bump();await ball.animate([{transform:P(bx,gy,720)},{transform:P(bx,gy,700)},{transform:P(bx,gy,740)},{transform:P(bx,gy,720)}],{duration:600,fill:'forwards'}).finished}
 await sleep(300);
 if(ok){ball.animate([{filter:'brightness(1)'},{filter:'brightness(3)'},{filter:'brightness(1)'}],{duration:500});SF.cap();burst(bx+22,gy+22,'✨',14,90);bsay('Capturou '+SP[d.s].n+'! 🎉');await sleep(1000);ball.remove();
  const nw=S.dex[d.s]!=2;S.dex[d.s]=2;if(S.team.length<6)S.team.push(d);else{bsay('Time cheio: '+SP[d.s].n+' foi para o Registro.');await sleep(900)}if(nw)await un(d.s);endBat(true,1)}
 else{ball.remove();burst(bx+22,gy+22,'💨',8,60);sp.getAnimations().forEach(a=>a.cancel());sp.animate([{transform:'scale(.2)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:300});bsay(SP[d.s].n+' escapou da rede!');SF.bump();await sleep(800);await foeTurn()}}
async function flee(){if(bat.lock)return;bat.lock=true;bui();if(Math.random()<.6){bsay('Você fugiu!');await sleep(800);endBat(true,1)}else{bsay('Não conseguiu fugir!');SF.bump();await sleep(800);await foeTurn()}}
function endBat(win,quiet){const cb=bat.done;bat=null;busy=false;$('bt').style.display='none';music(cur);save();hud();if(win&&cb&&!quiet)cb()}

/* ===== Entrada e telas ===== */
document.querySelectorAll('[data-d]').forEach(b=>{
 const d=b.dataset.d.split(',').map(Number);
 b.addEventListener('pointerdown',e=>{e.preventDefault();ac();press(d)});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{if(dir===d)dir=null}))});
$('bA').addEventListener('pointerdown',e=>{e.preventDefault();ac();act()});
$('box').addEventListener('pointerdown',e=>{e.preventDefault();act()});
const KM={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener('keydown',e=>{if(e.key=='Escape'){['bg','sh'].forEach(i=>{if($(i).style.display=='flex')$(i).style.display='none'});return}if(e.target.tagName=='INPUT')return;const k=KM[e.key];if(k){e.preventDefault();if(!e.repeat)press(k)}else if(e.key=='b'||e.key=='i'){if($('bg').style.display=='flex')$('bg').style.display='none';else if(!bat&&!busy&&!dlg)bag('t')}else if(e.key==' '||e.key=='Enter'||e.key=='e'){e.preventDefault();act()}});
addEventListener('keyup',e=>{if(KM[e.key]&&dir===KM[e.key])dir=null});
const LK={sk:['#f1c9a5','#e0b088','#c68e5f','#8d5a3b','#5a3a28'],hr:['#2b1b12','#6a3a1a','#d9a521','#c0392b','#e8e8ee','#3a5bd9'],sh:['#2f86d6','#d94b4b','#3fa34a','#8a4ad9','#f0a020','#222a38'],pt:['#2c3e63','#444','#6b4423','#1f5a3a'],st:['Curto','Longo','Boné']},LKN={sk:'Pele',hr:'Cabelo',sh:'Roupa',pt:'Calça',st:'Estilo'};
function look(){const w=$('sw');w.innerHTML='';for(const k in LK){const r=document.createElement('div');r.className='sr';r.innerHTML='<span>'+LKN[k]+'</span>';LK[k].forEach((v,i)=>{const b=document.createElement('button');if(k=='st')b.textContent=v;else b.style.background=v;b.className=(k=='st'?S.look.st==i:S.look[k]==v)?'on':'';b.onclick=()=>{S.look[k]=k=='st'?i:v;SF.ui();look()};r.appendChild(b)});w.appendChild(r)}
 const q=$('pv').getContext('2d');q.clearRect(0,0,22,30);q.drawImage(pspr(S.look,0,0),0,0)}
function press(d){dir=d;dirT=performance.now();if(dlg||busy||bat)return;if(moving())qd=d;else step(d[0],d[1])}
function fs(){const d=document,e=d.documentElement;try{if(!(d.fullscreenElement||d.webkitFullscreenElement)){(e.requestFullscreen||e.webkitRequestFullscreen).call(e);try{screen.orientation.lock('landscape').catch(()=>{})}catch(x){}}else(d.exitFullscreen||d.webkitExitFullscreen).call(d)}catch(x){}}
$('bf').onclick=fs;
$('bs').onclick=()=>{S.vol=(S.vol+2)%3;save();hud();if(S.vol){ac();SF.ui()}};
$('br').onclick=()=>{if(confirm('Apagar o progresso e recomeçar?')){try{localStorage.removeItem('abc_adv')}catch(e){}location.reload()}};
function enter(){ac();fs();$('ti').style.display='none';music(cur<0?0:cur)}
$('bc').onclick=()=>{enter();hud()};
$('bn').onclick=()=>{if(S.f.starter&&!confirm('Começar um novo jogo apaga o progresso atual. Continuar?'))return;try{localStorage.removeItem('abc_adv')}catch(e){}S=fresh();ac();fs();$('ti').style.display='none';$('in1').value='';$('in2').value='';$('nm').style.display='flex';look();music(5)};
$('go').onclick=()=>{S.name=$('in1').value.trim()||'Você';S.rv=$('in2').value.trim()||'Caio';S.x=4;S.y=7;pl.x=4*T;pl.y=7*T;cam.i=1;$('nm').style.display='none';save();SF.cap();music(0);hud();ban(ZN[0],ZS[0]);
 say(['Bem-vindo a Santo André, no ABC paulista! 🌆',S.name+', sua mãe disse que o Prof. '+PROF+' quer falar com você no laboratório.','Use as setas para andar e A para conversar. Fale com sua mãe e depois com o professor.'])};

load();pl.x=S.x*T;pl.y=S.y*T;
if(S.f.starter||S.name){$('bc').style.display='block';$('bc').textContent='▶ Continuar · '+S.name}
['caramelo','capi','sagui','onca','vira'].forEach(s=>$('cr').appendChild(crit(s,120)));
$('ti').style.display='flex';hud();requestAnimationFrame(frame);
document.addEventListener('pointerdown',()=>{if(AC||$('ti').style.display=='none')ac()},{once:true});
</script></body></html>
